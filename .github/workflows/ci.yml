name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4

      - name: Run full verification suite
        run: ./tests/run.sh
